name: tmp-acquire-pypdf-6-16-2

on:
  push:
    branches: [tmp-acquire-pypdf-6-16-2]

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify exact wheel
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 -o pypdf-6.16.2-py3-none-any.whl \
            https://files.pythonhosted.org/packages/13/f1/a2da3b55acd4ab737bf728c97edaaed5ec1d3c1236acb639dcdfa97e42c7/pypdf-6.16.2-py3-none-any.whl
          echo "c8b09a59399062fb45a1b8156c18a787a10a3dae03ac9674397a226712c94604  pypdf-6.16.2-py3-none-any.whl" | sha256sum -c -
          python - <<'PY'
          import zipfile
          p='pypdf-6.16.2-py3-none-any.whl'
          with zipfile.ZipFile(p) as z:
              data=z.read('pypdf/_version.py').decode()
              assert '6.16.2' in data, data
          print('wheel version verified: 6.16.2')
          PY
      - name: Upload verified wheel
        uses: actions/upload-artifact@v4
        with:
          name: pypdf-6.16.2-verified-wheel
          path: pypdf-6.16.2-py3-none-any.whl
          if-no-files-found: error
          retention-days: 1
